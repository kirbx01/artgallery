<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A retro Windows 98 / Vista style interactive art gallery built with pixel art, pure HTML/CSS/JS.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="myARTGALLERY">
<meta property="og:description" content="A retro Windows 98 / Vista style interactive pixel art gallery.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>myARTGALLERY - Retro Pixel Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23c0c0c0'/%3E%3Crect x='1' y='1' width='14' height='5' fill='%23000080'/%3E%3Crect x='3' y='9' width='3' height='3' fill='%23000080'/%3E%3Crect x='6' y='9' width='3' height='3' fill='%23ff7b3d'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%232ea84f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('is-embed')</script>
</head>
<body>

<main class="window" id="window" role="application" aria-label="Retro pixel art gallery">

  <header class="titlebar">
    <span class="titlebar__icon" aria-hidden="true">A</span>
    <span class="titlebar__text" id="titlebar-text">myARTGALLERY - [No Selection]</span>
    <div class="titlebar__btns">
      <a class="tb-btn tb-btn--back" id="back-link" href="https://github.com/" target="_blank" rel="noopener noreferrer" title="Back to README">
        <span aria-hidden="true">&larr;</span>
        <span class="tb-btn--back-full">Back to README</span>
        <span class="tb-btn--back-mini">Back</span>
      </a>
      <button class="tb-btn" id="btn-max" type="button" title="Maximize" aria-label="Maximize">&#9633;</button>
      <button class="tb-btn tb-btn--close" id="btn-close" type="button" title="Close" aria-label="Close">&#10005;</button>
    </div>
  </header>

  <nav class="menubar" aria-label="Application menu">

    <button class="menubar__item" type="button" data-menu="file" aria-expanded="false" aria-haspopup="true">File</button>
    <div class="menu" id="menu-file" role="menu" hidden>
      <button class="menu__item" type="button" role="menuitem" data-action="copy-link">Copy Shareable Link <span class="menu__key">Ctrl+L</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="next">Next Artwork <span class="menu__key">&rarr;</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="prev">Previous Artwork <span class="menu__key">&larr;</span></button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" data-action="grid">View as Square Grid <span class="menu__key">G</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="strip">View as Strip</button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" disabled>Save As... <span class="menu__key">Ctrl+S</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="reload">Reload Gallery</button>
    </div>

    <button class="menubar__item" type="button" data-menu="view" aria-expanded="false" aria-haspopup="true">View</button>
    <div class="menu" id="menu-view" role="menu" hidden>
      <button class="menu__item" type="button" role="menuitemcheckbox" aria-checked="false" data-action="toggle-grid">Pixel Grid</button>
      <button class="menu__item" type="button" role="menuitemcheckbox" aria-checked="true" data-action="toggle-bg">Transparency Grid</button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" data-action="fullscreen">Toggle Fullscreen</button>
    </div>

    <button class="menubar__item" type="button" disabled>Edit</button>
    <button class="menubar__item" type="button" disabled>Image</button>
    <button class="menubar__item" type="button" disabled>Colors</button>
    <button class="menubar__item" type="button" disabled>Help</button>
  </nav>

  <div class="client">

    <aside class="toolbox bevel-out" aria-label="MS Paint toolbox">
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Select" aria-pressed="true" title="Select">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#000" d="M2 1h1v7h1v1H2v3H1V2h1zm4 9h1v1H6zm2-1h1v1H8zm2-1h1v1h-1zm2-1h1v1h-1zM7 12h1v1H7zm2 1h1v1H9zm2-1h1v1h-1zm2 1h1v1h-1z"/></svg></span>
          <span class="sr-only">Select</span>
        </button>
        <button class="tool" type="button" data-tool="Eraser" aria-pressed="false" title="Eraser">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#fff" d="M4 11h6v3H4z"/><path fill="#000" d="M2 12l6-6 4 4-6 6H2v-4z" opacity=".55"/><path fill="#000" d="M2 12l6-6 4 4-6 6H2v-4zm6-6l1-1 4 4-1 1z"/></svg></span>
          <span class="sr-only">Eraser</span>
        </button>
      </div>
      <div class="toolbox__sep" aria-hidden="true"></div>
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Pencil" aria-pressed="false" title="Pencil">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#e8a33d" d="M9 3l4 4-6 6H3v-4l6-6z"/><path fill="#000" d="M9 3l1.4-1.4 4 4L13 7z"/><path fill="#000" d="M3 9h4v4H3z"/></svg></span>
          <span class="sr-only">Pencil</span>
        </button>
        <button class="tool" type="button" data-tool="Brush" aria-pressed="false" title="Brush">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#8a5a2b" d="M13 1l2 2-6 6-2-2 6-6z"/><path fill="#c0c0c0" d="M6 7h4v4H6z"/><path fill="#000" d="M5 10h6v3H5z"/><path fill="#000" d="M13 1l1 1-6 6-1-1 6-6z"/></svg></span>
          <span class="sr-only">Brush</span>
        </button>
      </div>
      <div class="toolbox__sep" aria-hidden="true"></div>
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Fill" aria-pressed="false" title="Fill with color">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#000080" d="M6 2l7 7-5 5-7-7 5-5zm-2 3l4 4 2-2-4-4z"/><path fill="#00c000" d="M13 10c1 2 2 3 2 4a2 2 0 11-4 0c0-1 1-2 2-4z"/></svg></span>
          <span class="sr-only">Fill</span>
        </button>
        <button class="tool" type="button" data-tool="Text" aria-pressed="false" title="Text">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#000" d="M3 3h10v2H9v9H7V5H3z"/></svg></span>
          <span class="sr-only">Text</span>
        </button>
      </div>
      <div class="toolbox__sep" aria-hidden="true"></div>
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Line" aria-pressed="false" title="Line">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#000" d="M2 14L12 4l2 2L4 16H2v-2z"/></svg></span>
          <span class="sr-only">Line</span>
        </button>
        <button class="tool" type="button" data-tool="Rectangle" aria-pressed="false" title="Rectangle">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="none" stroke="#000" d="M2 3h12v10H2z"/></svg></span>
          <span class="sr-only">Rectangle</span>
        </button>
      </div>
      <div class="toolbox__sep" aria-hidden="true"></div>
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Ellipse" aria-pressed="false" title="Ellipse">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="4.5" fill="none" stroke="#000"/></svg></span>
          <span class="sr-only">Ellipse</span>
        </button>
        <button class="tool" type="button" data-tool="Pick" aria-pressed="false" title="Color picker">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#000" d="M13 1l2 2-8 8-2-2 8-8z"/><path fill="#000" d="M5 9c-2 0-3 1-3 3l-1 2 2-1c2 0 3-1 3-3z"/></svg></span>
          <span class="sr-only">Color picker</span>
        </button>
      </div>
      <div class="toolbox__sep" aria-hidden="true"></div>
      <div class="toolbox__group">
        <button class="tool" type="button" data-tool="Magnify" aria-pressed="false" title="Magnify">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="#cfe8ff" stroke="#000"/><path fill="#000" d="M10.5 10.5l4 4-1.5 1.5-4-4z"/></svg></span>
          <span class="sr-only">Magnify</span>
        </button>
        <button class="tool" type="button" data-tool="Erase" aria-pressed="false" title="Clear canvas">
          <span class="tool__glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="#c0c0c0" stroke="#000" d="M2 12l6-7 2 2-5 6H2v-1z"/><path fill="#000" d="M2 15h12v1H2z"/></svg></span>
          <span class="sr-only">Clear canvas</span>
        </button>
      </div>
    </aside>

    <section class="stage">

      <div class="canvas-frame bevel-in" id="canvas-frame">
        <img id="artwork" alt="" decoding="async">
      </div>

      <div class="art-meta">
        <span class="art-meta__name" id="art-name">Loading&hellip;</span>
        <span id="art-size" class="art-meta__tag"></span>
        <a class="art-meta__tag" id="art-link" href="#">permalink</a>
        <a class="art-meta__tag" id="art-embed" href="#">embed</a>
      </div>

      <div class="tray bevel-out">
        <div class="tray__label" id="tray-label">Gallery &mdash; click a thumbnail to open it</div>
        <div class="tray__scroller bevel-in" id="tray" role="listbox" aria-label="Artwork thumbnails" tabindex="0"></div>
      </div>

      <div class="palette bevel-out">
        <div class="palette__row" id="palette" aria-label="Color palette"></div>
      </div>

      <div class="statusbar" role="status" aria-live="polite">
        <div class="statusbar__pane bevel-in statusbar__pane--w" id="status-viewing">Ready</div>
        <div class="statusbar__pane bevel-in statusbar__pane--h" id="status-index">&nbsp;</div>
        <div class="statusbar__pane bevel-in statusbar__pane--zoom" id="status-tool">&nbsp;</div>
        <div class="statusbar__pane bevel-in" id="status-msg">&nbsp;</div>
      </div>

    </section>
  </div>
</main>

<div id="embed-only"><img id="embed-art" alt="" decoding="sync"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
