<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A retro Windows 98 / Vista style interactive art gallery built with pixel art, pure HTML/CSS/JS.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="myARTGALLERY">
<meta property="og:description" content="A retro Windows 98 / Vista style interactive pixel art gallery.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>myARTGALLERY - Retro Pixel Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23c0c0c0'/%3E%3Crect x='1' y='1' width='14' height='5' fill='%23000080'/%3E%3Crect x='3' y='9' width='3' height='3' fill='%23000080'/%3E%3Crect x='6' y='9' width='3' height='3' fill='%23ff7b3d'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%232ea84f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('is-embed')</script>
</head>
<body>

<main class="window" id="window" role="application" aria-label="Retro pixel art gallery">

  <header class="titlebar">
    <span class="titlebar__icon" aria-hidden="true">A</span>
    <span class="titlebar__text" id="titlebar-text">myARTGALLERY - [No Selection]</span>
    <div class="titlebar__btns">
      <a class="tb-btn tb-btn--back" id="back-link" href="https://github.com/kirbx01/artgallery" target="_blank" rel="noopener noreferrer" title="Back to README" aria-label="Back to README">&lt;</a>
      <button class="tb-btn" id="btn-max" type="button" title="Maximize" aria-label="Maximize">&#9633;</button>
      <button class="tb-btn tb-btn--close" id="btn-close" type="button" title="Close" aria-label="Close">&#10005;</button>
    </div>
  </header>

  <nav class="menubar" aria-label="Application menu">

    <button class="menubar__item" type="button" data-menu="file" aria-expanded="false" aria-haspopup="true">File</button>
    <div class="menu" id="menu-file" role="menu" hidden>
      <button class="menu__item" type="button" role="menuitem" data-action="copy-link">Copy Shareable Link <span class="menu__key">Ctrl+L</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="next">Next Artwork <span class="menu__key">&rarr;</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="prev">Previous Artwork <span class="menu__key">&larr;</span></button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" data-action="grid">View as Square Grid <span class="menu__key">G</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="strip">View as Strip</button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" disabled>Save As... <span class="menu__key">Ctrl+S</span></button>
      <button class="menu__item" type="button" role="menuitem" data-action="reload">Reload Gallery</button>
    </div>

    <button class="menubar__item" type="button" data-menu="view" aria-expanded="false" aria-haspopup="true">View</button>
    <div class="menu" id="menu-view" role="menu" hidden>
      <button class="menu__item" type="button" role="menuitemcheckbox" aria-checked="false" data-action="toggle-grid">Pixel Grid</button>
      <button class="menu__item" type="button" role="menuitemcheckbox" aria-checked="true" data-action="toggle-bg">Transparency Grid</button>
      <div class="menu__sep" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem" data-action="fullscreen">Toggle Fullscreen</button>
    </div>

    <button class="menubar__item" type="button" disabled>Edit</button>
    <button class="menubar__item" type="button" disabled>Image</button>
    <button class="menubar__item" type="button" disabled>Colors</button>
    <button class="menubar__item" type="button" disabled>Help</button>
  </nav>

  <div class="client">

    <aside class="toolbox bevel-out" aria-label="MS Paint toolbox">
      <div class="toolbox__group">
        <button class="tool tool-btn" type="button" id="select" data-tool="Select" aria-pressed="true" title="Select">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><polygon points="2,2 2,13 6,10 9,14 11,13 8,9 13,9" fill="#000" stroke="#fff" stroke-width="1"/></svg></span>
          <span class="sr-only">Select</span>
        </button>
        <button class="tool tool-btn" type="button" id="free-select" data-tool="Free Select" aria-pressed="false" title="Free-form select">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><rect x="2" y="2" width="10" height="10" fill="none" stroke="#000" stroke-dasharray="2,2"/><rect x="6" y="6" width="8" height="8" fill="#fff" stroke="#000"/></svg></span>
          <span class="sr-only">Free-form select</span>
        </button>
      </div>
      <div class="toolbox__group">
        <button class="tool tool-btn" type="button" id="eraser" data-tool="Eraser" aria-pressed="false" title="Eraser">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><rect x="3" y="4" width="9" height="9" fill="#ffcc99" stroke="#000"/><rect x="3" y="4" width="9" height="3" fill="#ff6666"/><rect x="5" y="11" width="8" height="3" fill="#ffffff" stroke="#000"/></svg></span>
          <span class="sr-only">Eraser</span>
        </button>
        <button class="tool tool-btn" type="button" id="fill" data-tool="Fill" aria-pressed="false" title="Fill with colour">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><path d="M3,7 L9,1 L13,5 L7,11 Z" fill="#d4aa55" stroke="#000"/><path d="M5,11 L2,14 L5,15 L6,12 Z" fill="#000080"/><circle cx="11" cy="4" r="1" fill="#00ff00"/></svg></span>
          <span class="sr-only">Fill with colour</span>
        </button>
        <button class="tool tool-btn" type="button" id="dropper" data-tool="Pick" aria-pressed="false" title="Colour picker">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><path d="M11,2 L14,5 L6,13 L3,13 L3,10 Z" fill="#a0a0a0" stroke="#000"/><path d="M3,13 L5,15 L2,15 Z" fill="#000080"/><rect x="9" y="4" width="2" height="2" fill="#000"/><circle cx="12" cy="11" r="1" fill="#00ff00"/></svg></span>
          <span class="sr-only">Colour picker</span>
        </button>
        <button class="tool tool-btn" type="button" id="text" data-tool="Text" aria-pressed="false" title="Text">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><path d="M3,3 L13,3 M8,3 L8,13 M5,13 L11,13" stroke="#000" stroke-width="2" fill="none"/></svg></span>
          <span class="sr-only">Text</span>
        </button>
      </div>
      <div class="toolbox__group">
        <button class="tool tool-btn" type="button" id="line" data-tool="Line" aria-pressed="false" title="Line">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><line x1="2" y1="14" x2="14" y2="2" stroke="#000" stroke-width="2"/></svg></span>
          <span class="sr-only">Line</span>
        </button>
        <button class="tool tool-btn" type="button" id="curve" data-tool="Curve" aria-pressed="false" title="Curve">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><path d="M3,11 C3,4 13,12 13,5" fill="none" stroke="#000" stroke-width="2"/></svg></span>
          <span class="sr-only">Curve</span>
        </button>
        <button class="tool tool-btn" type="button" id="rect" data-tool="Rectangle" aria-pressed="false" title="Rectangle">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><rect x="2" y="3" width="12" height="10" fill="none" stroke="#000" stroke-width="2"/></svg></span>
          <span class="sr-only">Rectangle</span>
        </button>
        <button class="tool tool-btn" type="button" id="circle" data-tool="Ellipse" aria-pressed="false" title="Ellipse">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><ellipse cx="8" cy="8" rx="6" ry="5" fill="none" stroke="#000" stroke-width="2"/></svg></span>
          <span class="sr-only">Ellipse</span>
        </button>
      </div>
      <div class="toolbox__group">
        <button class="tool tool-btn" type="button" id="zoom" data-tool="Zoom" aria-pressed="false" title="Zoom">
          <span class="tool__glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" style="image-rendering: pixelated;"><circle cx="7" cy="7" r="4" fill="none" stroke="#000" stroke-width="2"/><line x1="10" y1="10" x2="14" y2="14" stroke="#000" stroke-width="2"/></svg></span>
          <span class="sr-only">Zoom</span>
        </button>
      </div>
    </aside>

    <section class="stage">

      <div class="canvas-frame bevel-in" id="canvas-frame">
        <img id="artwork" alt="" decoding="async">
      </div>

      <div class="art-meta">
        <span class="art-meta__name" id="art-name">Loading&hellip;</span>
        <span id="art-size" class="art-meta__tag"></span>
        <a class="art-meta__tag" id="art-link" href="#">permalink</a>
        <a class="art-meta__tag" id="art-embed" href="#">embed</a>
      </div>

      <div class="tray bevel-out">
        <div class="tray__label" id="tray-label">Gallery &mdash; click a thumbnail to open it</div>
        <div class="tray__scroller bevel-in" id="tray" role="listbox" aria-label="Artwork thumbnails" tabindex="0"></div>
      </div>

      <div class="palette bevel-out">
        <div class="palette__row" id="palette" aria-label="Color palette"></div>
      </div>

<section class="np bevel-out" id="np" data-tone="idle" aria-label="Spotify now playing">
        <div class="np__screen bevel-in" id="np-screen">
          <div class="np__lcd">
            <p class="np__state" id="np-state">Spotify: Idle</p>
            <p class="np__track" id="np-track" aria-live="polite">Spotify: Idle</p>
            <div class="np__progress" role="progressbar" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="np__fill" id="np-progress"></span>
            </div>
            <p class="np__time"><span id="np-elapsed">--:--</span> / <span id="np-total">--:--</span></p>
          </div>
        </div>

        <div class="np__artframe bevel-in">
          <img class="np__art" id="np-art" alt="" width="40" height="40" decoding="async">
        </div>

        <div class="np__btns">
          <button class="np__btn" type="button" id="np-prev" title="Previous track" aria-label="Previous track">&#9668;&#9668;</button>
          <button class="np__btn np__btn--play" type="button" id="np-toggle" title="Play or pause" aria-label="Play">&#9654;</button>
          <button class="np__btn" type="button" id="np-next" title="Next track" aria-label="Next track">&#9658;&#9658;</button>
        </div>

        <svg class="np__logo" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" role="img" aria-label="Spotify">
          <path d="M5 1h6l4 4v6l-4 4H5L1 11V5z" fill="#1db954"/>
          <g fill="none" stroke="#000" stroke-width="1" stroke-linecap="square">
            <path d="M4 5h2V4h4v1h2"/>
            <path d="M5 8h2V7h3v1h2"/>
            <path d="M6 11h2v-1h2v1h1"/>
          </g>
        </svg>
      </section>

      <div class="statusbar" role="status" aria-live="polite">
        <div class="statusbar__pane bevel-in statusbar__pane--w" id="status-viewing">Ready</div>
        <div class="statusbar__pane bevel-in statusbar__pane--h" id="status-index">&nbsp;</div>
        <div class="statusbar__pane bevel-in statusbar__pane--zoom" id="status-tool">&nbsp;</div>
        <div class="statusbar__pane bevel-in" id="status-msg">&nbsp;</div>
      </div>

    </section>
  </div>
</main>

<div id="embed-only"><img id="embed-art" alt="" decoding="sync"></div>

<script src="js/data.js"></script>
<script src="js/palette.js"></script>
<script src="js/nowplaying.js"></script>
<script src="js/app.js"></script>
</body>
</html>
